  pickup_components:
    description: Pick 1V4 and 3V4
    waypoints:
    - label: work
      dwell_s: 0.0
      arms:
        assembly_left: [0.55, -0.6, 0.9, 0.35, 0.0, 1.0]
        assembly_right: [-0.55, -0.6, 0.9, 0.35, 0.0, 1.0]
        inspection: [0.0, -0.35, 0.65, 0.25, 0.0, 0.5]
        packaging: [0.0, -0.35, 0.65, 0.25, 0.0, 0.5]
  assembly_task_1:

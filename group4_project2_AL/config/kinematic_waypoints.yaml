# Demo poses: replace with measured task poses before contact assembly.
# Add approach/work/retreat entries in execution order. Joint angles are radians.
units: radians
space: reference_urdf
verified_for_hardware: false
joint_names:
- shoulder_pan
- shoulder_lift
- elbow_flex
- wrist_flex
- wrist_roll
- gripper

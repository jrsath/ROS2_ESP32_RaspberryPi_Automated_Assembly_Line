# Demo poses: replace with measured task poses before contact assembly.
# Add approach/work/retreat entries in execution order. Joint angles are radians.
units: radians
space: gazebo_native
verified_for_hardware: false
joint_names:
- shoulder_pan
- shoulder_lift
- elbow_flex
- wrist_flex
- wrist_roll
- gripper
steps:
  pickup_components:
    description: Arm 1 picks 2V4; arm 2 picks 1V4
    waypoints:
    - label: work
      dwell_s: 0.0
      arms:
        assembly_left: [0.55, -0.75, 0.2, -0.1, 0.0, 0.3]
        assembly_right: [-0.55, -0.75, 0.2, -0.1, 0.0, 0.3]
        inspection: [0.0, -0.5, -0.05, -0.2, 0.0, -0.2]
        packaging: [0.0, -0.5, -0.05, -0.2, 0.0, -0.2]
  assembly_task_1:
    description: Align 2V4 over the top pin
    waypoints:
    - label: work
      dwell_s: 0.0
      arms:
        assembly_left: [0.1, -0.25, 0.1, 0.05, 0.0, -0.55]
        assembly_right: [-0.1, -0.25, 0.1, 0.05, 0.0, -0.55]
        inspection: [0.0, -0.5, -0.05, -0.2, 0.0, -0.2]
        packaging: [0.0, -0.5, -0.05, -0.2, 0.0, -0.2]
  assembly_task_2:
